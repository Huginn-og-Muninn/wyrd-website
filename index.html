<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyrd</title>
  <meta name="description" content="Get Wyrd.">
  <meta property="og:title" content="GET WYRD">
  <meta property="og:image" content="https://getwyrd.ai/hero.jpg">
  <style>
    :root { --bg: #0e0e0d; --fg: #f4f2ec; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--fg);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .hero { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: end start;
      background: url("hero.jpg") center / cover no-repeat; }
    .hero::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.1) 55%, rgba(0,0,0,0)); }
    h1 { position: relative; z-index: 1; margin: 0; padding: 0 16px 8vh 16px;
      font: 900 clamp(3.5rem, 15vw, 11rem)/.9 Impact, "Arial Black", "Helvetica Neue", sans-serif;
      letter-spacing: .01em; text-transform: uppercase; text-shadow: 0 2px 24px rgba(0,0,0,.5); }
    @media (min-width: 720px) { h1 { padding: 0 6vw 8vh; } }
  </style>
</head>
<body>
  <main class="hero">
    <h1>GET WYRD</h1>
  </main>
</body>
</html>

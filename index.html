<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyrd</title>
  <meta name="description" content="Wyrd test page.">
  <style>
    :root { --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --line: #dcd9d2; --ok: #2f7d4f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ecebe7; --muted: #9a978f; --line: #2c2b28; --ok: #5cbf83; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
    main { max-width: 32rem; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    h1 { font: 400 clamp(2.5rem, 8vw, 4rem)/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 8px 0 0; padding-top: 16px;
      border-top: 1px solid var(--line); font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <span class="status">Site is up</span>
    <h1>Wyrd</h1>
    <p>Test page for the Wyrd website. If you can read this, the deploy worked.</p>
    <dl>
      <dt>Host</dt><dd id="host">—</dd>
      <dt>Loaded</dt><dd id="loaded">—</dd>
      <dt>Version</dt><dd>test page v1</dd>
    </dl>
  </main>
  <script>
    document.getElementById('host').textContent = location.host || 'local file';
    document.getElementById('loaded').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
